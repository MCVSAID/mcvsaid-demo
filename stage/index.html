<!doctype html><html lang="en"><meta charset="utf-8"><script src="/demo.js?v=6981c099e30a"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage Shots · MCVSAID</title><link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/stage.css">
<link rel="stylesheet" href="/scenechat.css">
<body><noscript><style>#login{display:none}</style><p style="padding:24px;font:17px/1.5 sans-serif">This is the MCVSAID demo: the dashboard with six simulated cameras, run entirely in your browser. There is no server behind it and no login. Switch on JavaScript to try it.</p></noscript><header><h1>Stage Shots</h1></header>
<form id="login"><label>Your name <input id="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40"></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Log in</button></form>
<main id="shots" hidden>
<p id="now" aria-live="polite"></p>
<div id="bar"><button id="auto" aria-pressed="false">Automatic</button><button id="split" aria-pressed="false">Split screen</button><button id="tracking" aria-pressed="true" hidden title="Every camera's gimbal tracking: off, each stops where it points">Tracking: on</button><button id="autozoom" aria-pressed="true" hidden title="The automatic zoom on every camera: off, it holds where it is">Auto zoom: on</button><button id="wholepicture" hidden title="Every camera's whole picture now, and the automatic zoom off: for a zoom gone wrong">Whole picture</button><button id="roomview" aria-pressed="false" hidden>Room view</button></div>
<p id="hint"></p>
<p id="unset" hidden>Cameras are in a default row. <a href="/stage-layout">Set up the stage layout.</a></p>
<div id="stage" aria-label="Cameras, laid out as they stand: the stage at the top, the audience at the bottom">
<h2 class="sr">The stage</h2>
<div id="sides" aria-hidden="true"><span class="left"><b>Stage right</b> <small>house left</small></span><span class="back">Back of stage</span><span class="right"><b>Stage left</b> <small>house right</small></span></div>
<div id="performers" class="zone" role="group" aria-label="Performers, from the back of the stage to the front"></div>
<div id="wides" class="row" role="group" aria-label="Wide shots"><span class="label">Wide shots</span></div>
<div id="front" aria-hidden="true">Front of stage</div>
<div id="crowds" class="row" role="group" aria-label="Audience"><span class="label">Audience</span></div>
</div>
<section id="room" hidden aria-label="Room map"><h2 class="sr">Room map</h2><div class="map"></div><div class="side"><div class="details" aria-live="polite"></div><div class="waiting"></div></div></section>
<section id="remote" hidden></section>
<pre id="result" aria-live="polite"></pre></main><script src="/nav.js"></script><script src="/stage.js"></script><script src="/room.js"></script><script src="/setmap.js"></script><script src="/scenechat.js"></script></body></html>
